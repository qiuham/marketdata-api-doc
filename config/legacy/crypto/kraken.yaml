name: kraken

crawler:
  # 2026-11 改版后的 Mintlify 新站：页面清单取 sitemap.xml，每页加 .md 是原始 Markdown。
  # 旧站 /api/docs/... 的地址都跳到这里。
  sitemap_url: "https://docs.kraken.com/sitemap.xml"
  base_prefix: "https://docs.kraken.com/"
  # 取交易所（现货、衍生品）的指南和 API 参考；不取机构业务（托管、Prime）和 Embed/Pay
  include_prefixes:
    - "exchange/"
    - "api-reference/"
    - "home/"
  exclude_prefixes:
    - "api-reference/custody-external-api"
  max_discovery_pages: 1000

output:
  base_dir: "docs"
  dir_name: "kraken"
