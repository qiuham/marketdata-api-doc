name: binance

crawler:
  # 2026-11 改版后的新文档站。旧地址 /docs/binance-spot-api-docs/... 都跳到这里。
  site: "https://developers.binance.com"
  # 文档页：llms.txt 列出全部文档页，每页加 .md 是原始 Markdown；英文在前，中文在后
  llms_index: "/en/docs/llms.txt"
  primary_prefix: "/en/docs/"
  secondary_prefixes:
    - "/zh-CN/docs/"
  # API 参考：目录页列出全部 API，每个 API 一份 OpenAPI schema.yaml（含中英文），要用浏览器取
  catalog_url: "/en/docs/catalog"
  schema_version: "1.0.0"
  # 每次请求前等的秒数；太快会被限流（HTTP 429）一阵子
  request_delay: 0.5

output:
  base_dir: "docs"
  dir_name: "binance"
