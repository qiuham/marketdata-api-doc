    - "https://developers.binance.com/en/docs/catalog/advanced-trading-alpha-trading/api/ws-streams"
    - "https://developers.binance.com/en/docs/catalog/vip-and-institutional-sub-account/api/rest-api"

  selectors:
    main_content: "main .prose"
    title: "h1"

output:
  base_dir: "docs"
  dir_name: "binance"
